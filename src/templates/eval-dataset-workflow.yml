name: AI Eval

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  eval:
    name: Dataset eval
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npx tsx __RUNNER_PATH__
        env:
          __ENV_VAR__: ${{ secrets.__ENV_VAR__ }}
